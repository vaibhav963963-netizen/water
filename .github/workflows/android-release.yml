name: Live WaterPaper — Automated Android Release & OTA Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
      - 'scripts/**'
      - 'src/**'
      - 'app/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      custom_notes:
        description: 'Release Notes (optional)'
        required: false
        default: 'Automated performance updates and native liquid simulation improvements.'

# Prevent concurrent workflow runs and race conditions
concurrency:
  group: android-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, Verify & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Node.js & Run Verification Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Configure Keystore Signing Identity
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using base64-encoded secret production keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/debug.keystore
          else
            echo "Using repository established keystore (android/app/debug.keystore)..."
          fi
          test -f android/app/debug.keystore || { echo "Keystore missing!"; exit 1; }

      - name: 6. Automatically Resolve Monotonic Version
        id: version_info
        run: node scripts/version-manager.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 7. Build Release APK with Dynamic Version
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PversionCode=${{ steps.version_info.outputs.version_code }} -PversionName=${{ steps.version_info.outputs.version_name }} --stacktrace

      - name: 8. Verify APK Signature & Compute SHA-256
        id: apk_audit
        run: |
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK" || { echo "Release APK not found at $RELEASE_APK"; exit 1; }
          
          # Calculate SHA-256 checksum
          APK_SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          echo "Release APK SHA-256: ${APK_SHA256}"
          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          
          # Prepare named release asset
          TARGET_APK="LiveWaterPaper-v${{ steps.version_info.outputs.version_name }}.apk"
          cp "$RELEASE_APK" "$TARGET_APK"
          echo "target_apk=${TARGET_APK}" >> "$GITHUB_OUTPUT"
          
          # Generate structured update_manifest.json
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > update_manifest.json
          {
            "applicationId": "com.waterlivewallpaper",
            "versionCode": ${{ steps.version_info.outputs.version_code }},
            "versionName": "${{ steps.version_info.outputs.version_name }}",
            "apkFileName": "${TARGET_APK}",
            "sha256": "${APK_SHA256}",
            "publishedAt": "${TIMESTAMP}"
          }
          EOF
          
          cat update_manifest.json

      - name: 9. Publish GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version_info.outputs.tag_name }}"
          name: "Live WaterPaper v${{ steps.version_info.outputs.version_name }} (Build ${{ steps.version_info.outputs.version_code }})"
          body: |
            ## Live WaterPaper v${{ steps.version_info.outputs.version_name }}
            
            ${{ github.event.inputs.custom_notes || 'Automatic release from main branch.' }}
            
            ### Update Details:
            - **Application ID**: `com.waterlivewallpaper`
            - **Version Name**: `${{ steps.version_info.outputs.version_name }}`
            - **Version Code**: `${{ steps.version_info.outputs.version_code }}`
            - **SHA-256 Checksum**:
              ```text
              ${{ steps.apk_audit.outputs.sha256 }}
              ```
            
            ### Installation:
            1. Installed apps will automatically detect this release on launch or via **Check Updates**.
            2. To install manually, download `${{ steps.apk_audit.outputs.target_apk }}` below and tap to update.
          draft: false
          prerelease: false
          files: |
            ${{ steps.apk_audit.outputs.target_apk }}
            update_manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
